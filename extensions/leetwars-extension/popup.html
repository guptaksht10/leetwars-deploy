<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>LeetWars Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-main: #0B1120;
        --bg-card: #1E293B;
        --neon-green: #00FF9D;
        --text-primary: #F8FAFC;
        --text-muted: #94A3B8;
        --accent-blue: #38BDF8;
        --accent-red: #F87171;
        --border-color: #334155;
      }
      
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        width: 340px;
        background-color: var(--bg-main);
        color: var(--text-primary);
        margin: 0;
        padding: 0;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px;
        border-bottom: 1px solid var(--border-color);
        background: linear-gradient(180deg, rgba(30, 41, 59, 0.5) 0%, rgba(11, 17, 32, 1) 100%);
      }

      .logo {
        font-weight: 800;
        font-size: 18px;
        letter-spacing: 0.5px;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .logo-icon {
        color: var(--neon-green);
      }

      .content {
        padding: 16px;
      }

      .hidden {
        display: none !important;
      }

      .btn {
        display: block;
        width: 100%;
        padding: 12px;
        background-color: var(--neon-green);
        color: #000;
        text-align: center;
        text-decoration: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        border: none;
        cursor: pointer;
        transition: all 0.2s ease;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        box-shadow: 0 4px 14px rgba(0, 255, 157, 0.2);
      }

      .btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(0, 255, 157, 0.3);
        background-color: #00E68A;
      }

      #status-card {
        background-color: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .status-label {
        font-size: 11px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
      }

      .status-user {
        font-size: 14px;
        font-weight: 600;
        font-family: 'JetBrains Mono', monospace;
      }

      .success { color: var(--neon-green); }
      .error { color: var(--accent-red); }

      .section-title {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-muted);
        margin: 0 0 10px 0;
        font-weight: 600;
      }

      .contest-card {
        background: var(--bg-card);
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 10px;
        border-left: 3px solid var(--neon-green);
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      }

      .contest-name {
        font-weight: 600;
        font-size: 13px;
        margin-bottom: 8px;
        color: var(--text-primary);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .contest-stats {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--text-muted);
      }
      
      .stat-group {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .stat-val {
        color: var(--neon-green);
        font-weight: 600;
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
      }

      #jobs-container {
        margin-top: 20px;
      }

      #jobs-list {
        max-height: 140px;
        overflow-y: auto;
        font-size: 12px;
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        padding: 8px 12px;
        border-radius: 8px;
        font-family: 'JetBrains Mono', monospace;
      }
      
      /* Scrollbar Styling */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #64748b; }
      
      .job-item {
        padding: 6px 0;
        border-bottom: 1px dashed var(--border-color);
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .job-item:last-child { border-bottom: none; }
      .job-header { display: flex; justify-content: space-between; }
      .job-id { color: var(--text-primary); font-weight: 500; }
      .job-time { color: var(--text-muted); font-size: 10px; }
      .job-detail { color: var(--text-muted); font-size: 11px; }

      .problem-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 10px;
        border-top: 1px dashed var(--border-color);
        padding-top: 10px;
      }

      .problem-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
      }

      .problem-slug {
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 180px;
      }

      .problem-status {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 4px;
        text-transform: uppercase;
        font-weight: 600;
      }
      .status-ACCEPTED { background-color: rgba(0, 255, 157, 0.1); color: var(--neon-green); }
      .status-FAIL { background-color: rgba(248, 113, 113, 0.1); color: var(--accent-red); }
      .status-NOT_STARTED { background-color: rgba(148, 163, 184, 0.1); color: var(--text-muted); }

      .pulse {
        width: 8px;
        height: 8px;
        background-color: var(--neon-green);
        border-radius: 50%;
        box-shadow: 0 0 8px var(--neon-green);
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 157, 0.7); }
        70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(0, 255, 157, 0); }
        100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 157, 0); }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo">
        <img src="icon.png" width="20" height="20" style="border-radius: 4px;" alt="LeetWars Logo" />
        LEETWARS
      </div>
      <button id="logout-btn" title="Logout" style="background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px;" class="hidden">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    </div>
    
    <div class="content">
      <div id="loading" style="text-align: center; color: var(--text-muted); padding: 20px;">
        <div class="pulse" style="margin: 0 auto 10px;"></div>
        INITIALIZING...
      </div>
      
      <div id="unauthenticated" class="hidden">
        <div style="text-align: center; margin-bottom: 20px;">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--border-color)" stroke-width="1.5" style="margin-bottom: 12px;">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
          <p style="color: var(--text-muted); margin: 0; font-size: 13px;">Link your account to track submissions in real-time.</p>
        </div>
        <button id="login-btn" class="btn">ENTER ARENA</button>
      </div>

      <div id="authenticated" class="hidden">
        <div id="status-card">
          <div>
            <div class="status-label">Live Sync Active</div>
            <div id="username" class="status-user success"></div>
          </div>
          <div class="pulse"></div>
        </div>
        
        <div id="contests-container">
          <h2 class="section-title">Active Contests</h2>
          <div id="contests-loading" style="font-size: 12px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace;">FETCHING...</div>
          <div id="contests-list">
            <!-- Contests injected here -->
          </div>
        </div>

        <div id="jobs-container">
          <h2 class="section-title">Arena Telemetry</h2>
          <div id="jobs-list">
            <!-- Jobs injected here -->
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
